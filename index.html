<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Keanlyz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.status{height:48px;padding:14px 24px;display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.nav{padding:12px 22px;font-size:32px;font-weight:750;letter-spacing:-1px}
.search{margin:8px 18px 25px;padding:13px 16px;border-radius:13px;background:#e4e4e9;color:#888}
.section{margin:22px 22px 9px;font-size:13px;color:#777;text-transform:uppercase;letter-spacing:.5px}
.group{background:white;border-radius:14px;margin:0 16px;overflow:hidden}
.item{width:100%;padding:13px 15px;display:flex;align-items:center;gap:13px;border:0;background:white;text-align:left;font-size:16px;color:#111;min-height:57px}
.item+.item{border-top:1px solid #eee}
.ico{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;color:white;font-weight:700}
.label{flex:1}
.sub{display:block;font-size:12px;color:#888;margin-top:3px}
.arrow{color:#bbb;font-size:22px}
.hero{margin:0 16px 24px;padding:23px;border-radius:20px;background:linear-gradient(135deg,#24243b,#7771a4);color:white}
.hero small{opacity:.7}
.hero h2{font-size:27px;margin:14px 0 5px}
.hero p{font-size:13px;opacity:.8}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffdf;backdrop-filter:blur(20px);border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:13px 5px calc(13px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;color:#888;font-size:12px}
.tabs b{display:block;font-size:21px;margin-bottom:3px}
.sheet{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end}
.sheet.show{display:flex}
.panel{background:#f2f2f7;width:100%;padding:25px;border-radius:23px 23px 0 0;min-height:230px}
.panel button{float:right;border:0;border-radius:50%;padding:8px}
.panel p{color:#777;line-height:1.5}
@media(prefers-color-scheme:dark){
body{background:#000;color:white}
.group,.item{background:#1c1c1e;color:white}
.item+.item{border-color:#38383a}
.search{background:#2c2c2e}
.tabs{background:#1c1c1eea;border-color:#38383a}
.panel{background:#1c1c1e}
.section{color:#aaa}
}
</style>
</head>
<body>
<div class="status"><span id="time">9:41</span><span>◐ ▮▮▮ ◉ ▰</span></div>
<header class="nav">Pengaturan</header>
<div class="search">⌕ &nbsp; Cari pengaturan</div>
<div class="hero"><small>KEANLYZ · PERSONAL SPACE</small><h2>Halo, Kean.</h2><p>Selamat datang di pengalaman Keanlyz.</p></div>
<div class="section">Akun</div>
<div class="group">
<button class="item" onclick="openPage('Akun')"><span class="ico" style="background:#888">K</span><span class="label">Keanlyz<span class="sub">Akun dan keamanan</span></span><span class="arrow">›</span></button>
</div>
<div class="section">Konektivitas</div>
<div class="group">
<button class="item" onclick="openPage('Mode pesawat')"><span class="ico" style="background:#ff9500">✈</span><span class="label">Mode pesawat</span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Wi-Fi')"><span class="ico" style="background:#087cff">⌁</span><span class="label">Wi-Fi<span class="sub">Pengaturan simulasi</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Bluetooth')"><span class="ico" style="background:#087cff">ᛒ</span><span class="label">Bluetooth</span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Jaringan seluler')"><span class="ico" style="background:#34c759">▥</span><span class="label">Jaringan seluler</span><span class="arrow">›</span></button>
</div>
<div class="section">Personalisasi</div>
<div class="group">
<button class="item" onclick="openPage('Tampilan dan kecerahan')"><span class="ico" style="background:#5856d6">◐</span><span class="label">Tampilan & kecerahan</span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Wallpaper')"><span class="ico" style="background:#af52de">▧</span><span class="label">Wallpaper</span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Suara dan haptik')"><span class="ico" style="background:#ff2d55">♫</span><span class="label">Suara & haptik</span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Notifikasi')"><span class="ico" style="background:#ff3b30">▣</span><span class="label">Notifikasi</span><span class="arrow">›</span></button>
</div>
<div class="section">Sistem</div>
<div class="group">
<button class="item" onclick="openPage('Privasi dan keamanan')"><span class="ico" style="background:#8e8e93">▣</span><span class="label">Privasi & keamanan</span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Penyimpanan')"><span class="ico" style="background:#007aff">▤</span><span class="label">Penyimpanan</span><span class="arrow">›</span></button>
<button class="item" onclick="openPage('Tentang Keanlyz')"><span class="ico" style="background:#636366">ⓘ</span><span class="label">Tentang Keanlyz<span class="sub">Versi 1.0</span></span><span class="arrow">›</span></button>
</div>
<nav class="tabs"><button><b>⚙</b>Pengaturan</button><button><b>⌂</b>Beranda</button><button><b>◉</b>Profil</button></nav>
<div class="sheet" id="sheet"><div class="panel"><button onclick="closePage()">✕</button><h2 id="heading">Keanlyz</h2><p id="description">Pengaturan Keanlyz.</p></div></div>
<script>
function openPage(name){
document.getElementById('heading').textContent=name;
document.getElementById('description').textContent='Halaman '+name+' sedang dalam pengembangan. Fitur ini merupakan simulasi antarmuka dan tidak mengubah pengaturan asli perangkat.';
document.getElementById('sheet').classList.add('show');
}
function closePage(){document.getElementById('sheet').classList.remove('show')}
function updateTime(){document.getElementById('time').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false})}
updateTime();setInterval(updateTime,30000);
</script>
</body>
</html>
